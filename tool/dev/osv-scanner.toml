# Настройки OSV-Scanner (проверка уязвимостей зависимостей в CI — шаг
# «Vulnerabilities» в .github/workflows/ci.yml, отчёт — tool/dev/osv_report.py).
#
# Уязвимость, которая к нам не относится (уязвима функция пакета, которую мы
# не вызываем) или исправления которой пока нельзя взять (несовместимость
# версий), — сюда, с причиной и сроком: после срока сканер снова её покажет.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-01-31
# reason = "Уязвим разбор X, приложение его не вызывает (решение владельца ДД.ММ.ГГГГ)"
