org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 (1.6.3). Оба флага — временные, их же добавляет мигратор Flutter
# (docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin):
# · builtInKotlin=false — часть сторонних плагинов ещё сама подключает
#   kotlin-android (KGP); со встроенным Kotlin AGP 9 такие не собирает.
#   Наш :app на встроенный Kotlin уже переведён: KGP к нему подключает
#   Flutter Gradle Plugin, пока флаг false. Когда все плагины перейдут
#   (Flutter перестанет предупреждать «plugins that apply KGP») — true.
# · newDsl=false — Flutter Gradle Plugin ещё на старых типах DSL
#   (flutter/flutter#180137).
android.builtInKotlin=false
android.newDsl=false
